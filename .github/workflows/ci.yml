name: Verificação
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run test:deploy
      - run: python3 -m unittest discover -s scripts -p "test_package_hostinger.py"
      - run: npm run build
