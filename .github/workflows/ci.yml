name: Verificação
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: hospedae_test
          MYSQL_USER: hospedae_ci
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run test:deploy
      - run: npm run test:php:syntax
      - name: Executar testes PHP CLI sem base de dados
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-mbstring php-mysql default-mysql-client
          php -v
          find backend/public/api backend/tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php backend/tests/staging_guard.php
          php backend/tests/validation.php
      - name: Aplicar migrações e testar duas pousadas em MySQL descartável
        env:
          MYSQL_PWD: ci-only-password
          HOSPEDAE_TEST_CONFIG_PATH: /tmp/hospedae-ci-test-config.php
          RUN_PHP_INTEGRATION: I_UNDERSTAND_THIS_IS_A_DISPOSABLE_DATABASE
        run: |
          set -euo pipefail
          for migration in backend/sql/*.sql; do
            echo "A aplicar $(basename "$migration") na base efémera da CI"
            mysql --host=127.0.0.1 --port=3306 --user=hospedae_ci hospedae_test < "$migration"
          done
          trap 'rm -f "$HOSPEDAE_TEST_CONFIG_PATH"' EXIT
          cat > "$HOSPEDAE_TEST_CONFIG_PATH" <<'PHP'
          <?php
          return [
              'host' => '127.0.0.1', 'database' => 'hospedae_test',
              'user' => 'hospedae_ci', 'password' => 'ci-only-password',
              'environment' => 'staging', 'trusted_origin' => 'https://staging.exemplo.org',
              'cookie_path' => '/test/', 'php_timezone' => 'America/Recife',
              'mysql_time_offset' => '-03:00',
          ];
          PHP
          php backend/tests/diagnostic.php
          php backend/tests/integration.php
      - run: npm run test:php:http:guard
      - run: python3 -m unittest discover -s scripts -p "test_package*.py"
      - run: npm run build
